name: charybdis

on:
  # Triggered every ~15 min by an external scheduler (a local launchd agent, or
  # cron-job.org) hitting the dispatch API. GitHub's own schedule is unreliable
  # and races with the external trigger, so it is intentionally not used.
  workflow_dispatch: {}

permissions:
  contents: write # so the host can commit her updated log back

concurrency:
  group: charybdis
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agent deps
        working-directory: agent
        run: npm ci --no-audit --no-fund

      # Route creator fees (∝ all trading) into the infection so buys drive her
      # stage. Runs before the agent, so a fee-driven crossing is narrated in the
      # same invocation. Non-fatal: a failure here must not block her post.
      - name: Route creator fees into the infection
        if: ${{ vars.PUMP_MINT != '' }}
        continue-on-error: true
        working-directory: agent
        env:
          HOST_PRIVATE_KEY: ${{ secrets.HOST_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          PUMP_MINT: ${{ vars.PUMP_MINT }}
        run: npm run fee-router

      - name: Run agent
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          HOST_PRIVATE_KEY: ${{ secrets.HOST_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          POLYASCUS_PROGRAM_ID: ${{ vars.POLYASCUS_PROGRAM_ID }}
          PUMP_MINT: ${{ vars.PUMP_MINT }}
        run: npm run run

      - name: Answer mentions
        continue-on-error: true
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
        run: npm run replies

      # Remark on a select few wild posts (kin: crabs/marine life; dry-world:
      # onchain/web3 churn through a crab's eye), auto-replying to the worthy ones
      # as herself. Self-limited inside comment.ts (daily cap + min-gap +
      # probability, dedup, follower floor); the judgment stays silent on
      # death/grief, medicine, politics, and real-world tragedy. Non-fatal.
      - name: Comment in the wild
        continue-on-error: true
        working-directory: agent
        env:
          COMMENT_AUTOPOST: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
        run: npm run comment

      - name: Commit logs if changed
        run: |
          if [[ -n "$(git status --porcelain charybdis-log.json replies-log.json comments-log.json comment-queue.json charybdis-state.json charybdis-currents.json)" ]]; then
            git config user.name "charybdis"
            git config user.email "charybdis@polyascus.com"
            git add charybdis-log.json replies-log.json comments-log.json comment-queue.json charybdis-state.json charybdis-currents.json
            git commit -m "log: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || (git pull --rebase --autostash origin main && git push)
          else
            echo "no log changes"
          fi
