# Charybdis's host. A Render cron (~5 min) that runs the agent directly
# (agent/render-tick.sh): gate on cadence, then post + reply and commit her log
# back to main. Replaces the GitHub Actions dispatch (that endpoint had outages);
# git pull/push is the only GitHub surface, so an Actions incident no longer stops
# her. The env vars below must be set on the service — GH_TOKEN needs contents:write.
services:
  - type: cron
    name: charybdis-tick
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    # --include=dev so tsx (a devDependency) installs even under NODE_ENV=production.
    buildCommand: "cd agent && npm ci --include=dev --no-audit --no-fund"
    startCommand: "bash agent/render-tick.sh"
    envVars:
      - key: GH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: HOST_PRIVATE_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: PUMP_MINT
        sync: false
      - key: POLYASCUS_PROGRAM_ID
        sync: false
